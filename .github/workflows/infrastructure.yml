# ==============================================================================
# Infrastructure Pipeline — Terragrunt Plan + Apply
#
# pull_request → plan only
# push to main → plan + apply
#
# Required GitHub Secrets : AWS_ROLE_ARN
# Required GitHub Variables: AWS_REGION
# ==============================================================================

name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'live/**'
      - 'modules/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'live/**'
      - 'modules/**'
      - 'scripts/**'

env:
  TF_VERSION: "1.10.5"
  TG_VERSION: "0.75.10"
  TF_INPUT:   "false"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          wget -q "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64" \
            -O /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION }}

      - name: Terragrunt Plan
        working-directory: live/dev
        run: |
          terragrunt run-all plan \
            --terragrunt-exclude-dir "$(pwd)/argocd" \
            --non-interactive

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          wget -q "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64" \
            -O /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION }}

      - name: Terragrunt Apply
        working-directory: live/dev
        run: |
          terragrunt run-all apply \
            --terragrunt-exclude-dir "$(pwd)/argocd" \
            --non-interactive \
            -auto-approve
